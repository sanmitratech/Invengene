<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Invengene LRP Workspace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
<style>
/* Layout: sticky top bar, centred 1200px work area, content in white cards on a pale tint ground */
:root{
  --navy:#1A2740; --teal:#0F7C88; --aqua:#19AFC0; --ground:#F5F9FA; --surface:#FFFFFF;
  --tint:#EEF6F8; --tint2:#E4F3F5; --line:#DCEBEE; --line2:#CFE6EA;
  --ink:#1A2740; --muted:#56677B; --faint:#8494A6;
  --good:#1D7A4F; --good-bg:#E6F4EC; --warn:#9A5B00; --warn-bg:#FDF2DE; --bad:#B3261E; --bad-bg:#FBE9E7; --info-bg:#E7F1FB; --info:#1F5F99;
  --font:"Aptos","Segoe UI","Lato",Arial,sans-serif;
  --r-card:16px; --r-chip:10px;
  --shadow:0 1px 2px rgba(26,39,64,.04),0 4px 16px rgba(26,39,64,.04);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink)}
body{font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--aqua);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;text-wrap:balance;color:var(--navy)}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.label{font-size:12px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:24px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:24px;height:64px}
.brand{display:flex;align-items:center;gap:12px;flex-shrink:0}
.brand img{height:26px;width:auto}
.brand .sep{width:1px;height:24px;background:var(--line2)}
.brand b{font-size:14px;color:var(--navy);letter-spacing:.01em;white-space:nowrap}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.nav button{border:0;background:none;padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:700;white-space:nowrap;display:flex;gap:6px;align-items:center}
.nav button:hover{background:var(--tint);color:var(--navy)}
.nav button[aria-current="page"]{background:var(--tint2);color:var(--teal)}
.nav .count{background:var(--teal);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:18px}
.who{display:flex;align-items:center;gap:10px;flex-shrink:0;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;background:var(--surface)}
.who:hover{border-color:var(--line2);background:var(--tint)}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--tint2);color:var(--teal);flex-shrink:0}
.who .t{display:flex;flex-direction:column;line-height:1.2;text-align:left}
.who .t b{font-size:13px} .who .t span{font-size:11px;color:var(--muted)}
main{padding-block:32px 64px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow)}
.card-pad{padding:24px}
.card-h{display:flex;align-items:center;gap:12px;padding:20px 24px 0}
.card-h h3{font-size:15px}
.card-b{padding:16px 24px 24px}
.panel{background:var(--tint);border-radius:var(--r-card);padding:20px 24px}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.g4,.g3,.g2{grid-template-columns:minmax(0,1fr)}.brand .sep,.brand b,.who .t{display:none}.top .wrap{gap:12px}}

/* page header */
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ph h1{font-size:28px;line-height:1.2;margin-top:6px}
.ph p{margin-top:6px;color:var(--muted);max-width:68ch}

/* kpis */
.kpi{padding:20px 22px;display:flex;flex-direction:column;gap:6px}
.kpi .v{font-size:28px;font-weight:700;color:var(--navy);line-height:1.15}
.kpi .v small{font-size:14px;font-weight:700;color:var(--muted);margin-left:4px}
.kpi .s{font-size:12px;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:9px 16px;font-weight:700;border:1px solid var(--line2);background:var(--surface);color:var(--navy);white-space:nowrap}
.btn:hover{background:var(--tint)}
.btn-primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn-primary:hover{background:#0B6A75}
.btn-danger{color:var(--bad);border-color:#F0C7C3}
.btn-danger:hover{background:var(--bad-bg)}
.btn-sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;color:var(--teal);font-weight:700;padding:0}
.link:hover{text-decoration:underline}
.icon{width:16px;height:16px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap;line-height:1.5}
.pill .icon{width:12px;height:12px}
.p-good{background:var(--good-bg);color:var(--good)}
.p-teal{background:var(--tint2);color:var(--teal)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-info{background:var(--info-bg);color:var(--info)}
.p-bad{background:var(--bad-bg);color:var(--bad)}
.p-grey{background:#EEF1F4;color:#5B6878}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line);border-radius:var(--r-chip);padding:3px 10px;color:var(--muted);background:var(--surface);white-space:nowrap}

/* filters */
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:12px;padding:0 14px;background:var(--surface);min-width:0}
.search input{border:0;outline:0;padding:10px 0;width:100%;background:none}
.select,.input,textarea.input{border:1px solid var(--line2);border-radius:10px;padding:9px 12px;background:var(--surface);min-width:0;width:100%}
.filters .select{width:auto}
.input:focus,.select:focus,textarea:focus{outline:2px solid var(--aqua);outline-offset:0;border-color:transparent}
.seg{display:inline-flex;background:var(--tint);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-weight:700;color:var(--muted);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--navy);box-shadow:0 1px 3px rgba(26,39,64,.1)}

/* deal cards */
.deals{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.deal{text-align:left;padding:20px;display:flex;flex-direction:column;gap:14px;transition:border-color .15s,box-shadow .15s,transform .15s;cursor:pointer;width:100%}
.deal:hover{border-color:var(--aqua);box-shadow:0 6px 24px rgba(15,124,136,.10)}
.deal .id{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.deal h3{font-size:17px;line-height:1.3}
.deal .sub{font-size:13px;color:var(--muted)}
.deal .foot{display:flex;align-items:flex-end;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.deal .foot .v{font-size:18px;font-weight:700;color:var(--navy)}
.spark{display:block}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:12px 14px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tabs button:hover{color:var(--navy)}
.tabs button[aria-selected="true"]{color:var(--teal);border-bottom-color:var(--teal)}
.tabs button .icon{width:13px;height:13px}

/* key/value lists */
.kv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px 16px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:700;color:var(--navy);text-align:right;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
.facts>div{padding:16px 24px;border-right:1px solid var(--line)}
.facts>div:last-child{border-right:0}
.facts .v{font-size:20px;font-weight:700;color:var(--navy);margin-top:2px}
@media (max-width:760px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.facts>div:nth-child(2){border-right:0}.facts>div:nth-child(-n+2){border-bottom:1px solid var(--line)}}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tr.hl td{background:var(--tint)}
.tbl tr.clickable{cursor:pointer} .tbl tr.clickable:hover td{background:var(--tint)}
.tbl input.input{padding:6px 10px;text-align:right;max-width:140px}

/* banner */
.banner{display:flex;gap:12px;align-items:center;border-radius:14px;padding:14px 18px;font-size:13.5px;flex-wrap:wrap}
.banner.warn{background:var(--warn-bg);color:#6B4100}
.banner.info{background:var(--tint2);color:var(--navy)}
.banner.bad{background:var(--bad-bg);color:#7D1A15}
.banner.good{background:var(--good-bg);color:#145536}

/* bars */
.hbars{display:flex;flex-direction:column;gap:12px}
.hbar{display:grid;grid-template-columns:72px minmax(0,1fr) 88px;gap:12px;align-items:center;font-size:13px}
.hbar .track{height:10px;background:var(--tint);border-radius:6px;overflow:hidden}
.hbar .fill{height:100%;background:var(--aqua);border-radius:6px}
.hbar .val{text-align:right;font-weight:700;color:var(--navy)}
.stage{display:grid;grid-template-columns:150px minmax(0,1fr) 32px;gap:12px;align-items:center;font-size:13px}
.stage .track{height:22px;background:var(--tint);border-radius:7px;overflow:hidden}
.stage .fill{height:100%;background:var(--teal);opacity:.85;border-radius:7px}

/* timeline */
.tl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;position:relative}
.ms{padding:20px;display:flex;flex-direction:column;gap:12px}
.ms .step{display:flex;align-items:center;gap:10px}
.ms .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;border:2px solid var(--line2);color:var(--muted);background:var(--surface)}
.ms.done .dot{background:var(--teal);border-color:var(--teal);color:#fff}
.ms .dates{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.ms .dates span:nth-child(odd){color:var(--muted)}
.ms .dates span:nth-child(even){font-weight:700;color:var(--navy);text-align:right}
@media (max-width:760px){.tl{grid-template-columns:minmax(0,1fr)}}

/* cost bar */
.cbar{display:flex;height:34px;border-radius:9px;overflow:hidden;gap:2px}
.cbar div{display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;min-width:0;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* login */
.login{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding-block:48px}
.login-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:48px;align-items:center}
@media (max-width:900px){.login-grid{grid-template-columns:minmax(0,1fr);gap:32px}}
.persona{text-align:left;padding:18px 20px;display:flex;gap:14px;align-items:flex-start;width:100%}
.persona:hover{border-color:var(--aqua)}
.persona .avatar{width:40px;height:40px;font-size:14px}
.persona b{display:block;color:var(--navy)}
.persona .r{font-size:12.5px;color:var(--teal);font-weight:700}
.persona .d{font-size:12.5px;color:var(--muted);margin-top:4px}

/* forms */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px}
@media (max-width:640px){.form-grid{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12.5px;font-weight:700;color:var(--navy)}
.field .hint{font-size:12px;color:var(--muted)}
.field .err{font-size:12px;color:var(--bad);font-weight:700}
.field.full{grid-column:1/-1}
.field.invalid .input,.field.invalid .select{border-color:var(--bad)}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.steps div{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--faint);padding:8px 14px 8px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.steps div b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--muted);font-size:12px}
.steps div.on{color:var(--teal);border-color:var(--aqua)}
.steps div.on b{background:var(--teal);color:#fff}
.steps div.done b{background:var(--tint2);color:var(--teal)}
.steps div.done{color:var(--navy)}

/* diff */
.old{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.new{font-weight:700;color:var(--navy)}
.delta{font-size:12px;font-weight:700}

/* access matrix */
.lock{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:48px 24px}
.lock .ring{width:52px;height:52px;border-radius:50%;background:var(--tint);display:grid;place-items:center;color:var(--teal)}
.lock .ring .icon{width:22px;height:22px}
.acc{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700}
.acc.edit{color:var(--teal)} .acc.view{color:var(--navy)} .acc.none{color:var(--faint);font-weight:400}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px rgba(26,39,64,.25);z-index:50;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px)}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.att{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.att:last-child{border-bottom:0}
.att .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.feed{display:flex;flex-direction:column}
.feed .it{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.feed .it:last-child{border-bottom:0}
.overlay{position:fixed;inset:0;background:rgba(26,39,64,.35);z-index:40;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:48px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.modal{width:100%;max-width:720px}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .25s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}

/* search, reports, analysis */
mark{background:#FFF0B3;color:inherit;border-radius:3px;padding:0 1px}
.search.big{flex:none;padding:2px 18px;border-radius:14px;font-size:16px;box-shadow:var(--shadow)}
.search.big input{padding:13px 0}
.chipbtn{cursor:pointer;font-weight:700;color:var(--navy)}
.chipbtn:hover{border-color:var(--aqua);color:var(--teal);background:var(--tint)}
.s-layout{grid-template-columns:240px minmax(0,1fr);align-items:start}
@media (max-width:900px){.s-layout{grid-template-columns:minmax(0,1fr)}}
.sortbtn{border:0;background:none;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}
.sortbtn:hover,.sortbtn.on{color:var(--teal)}
.hit{font-size:12px;margin-top:4px;max-width:40ch}
.rep{text-align:left;padding:14px 16px;display:flex;flex-direction:column;gap:2px;width:100%;box-shadow:none}
.rep b{color:var(--navy);font-size:14px;display:flex;gap:6px;align-items:center}
.rep span{font-size:12.5px;color:var(--muted)}
.rep:hover{border-color:var(--aqua)}
.rep.on{border-color:var(--teal);background:var(--tint2)}
.rep.locked{opacity:.6}
.hbar.wide{grid-template-columns:minmax(0,180px) minmax(0,1fr) 96px}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar.an{grid-template-columns:minmax(0,150px) minmax(0,1fr) 92px 40px;border:0;background:none;text-align:left;width:100%;padding:4px 6px;margin:-4px -6px;border-radius:8px;width:calc(100% + 12px)}
button.hbar.an:hover{background:var(--tint)}
button.hbar.an:hover .fill{background:var(--teal)}
.hbar.an .sh{font-size:12px;color:var(--muted);text-align:right}
.hbar.tot{border-top:1px solid var(--line);padding-top:12px;margin-top:2px}
.hbar.tot .nm,.hbar.tot .val{font-weight:700;color:var(--navy)}
@media (max-width:640px){.hbar.wide{grid-template-columns:minmax(0,100px) minmax(0,1fr) 84px}.hbar.an{grid-template-columns:minmax(0,90px) minmax(0,1fr) 80px 34px}}
.sliders{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px 28px}
@media (max-width:1000px){.sliders{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.sliders{grid-template-columns:minmax(0,1fr)}}
input[type=range]{accent-color:var(--teal);width:100%;min-width:0}
.wv{min-width:92px;text-align:right;color:var(--navy);font-size:13px}
.qa{display:flex;gap:14px;align-items:center;padding:16px 18px;text-align:left;width:100%}
.qa:hover{border-color:var(--aqua)}
.qa-ic{width:40px;height:40px;border-radius:12px;background:var(--tint2);color:var(--teal);display:grid;place-items:center;flex-shrink:0}
.qa-t{min-width:0;flex:1}
.qa-t b{display:block;color:var(--navy);font-size:15px}
.qa-t span{display:block;font-size:12.5px;color:var(--muted)}
.qa-go{color:var(--faint)}
.qa:hover .qa-go{color:var(--teal)}
@media (max-width:1280px){.brand b{display:none}.brand .sep{display:none}}
.nav button{padding:8px 10px}
</style>

/* ---------- charts ---------- */
function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function sparkline(vals, w=120, h=36){
  const max=Math.max(...vals), min=Math.min(...vals), rng=(max-min)||1;
  const pts=vals.map((v,i)=>[i*(w-4)/(vals.length-1)+2, h-4-(v-min)/rng*(h-10)]);
  const line=pts.map(p=>p.map(x=>x.toFixed(1)).join(",")).join(" ");
  const last=pts[pts.length-1];
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <polygon points="2,${h} ${line} ${w-2},${h}" fill="#19AFC0" fill-opacity=".12"/>
    <polyline points="${line}" fill="none" stroke="#0F7C88" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="#0F7C88"/></svg>`;
}
function barChart(labels, vals, {h=220, fmt=v=>inr(v), hi=-1, color="#19AFC0", unit=""}={}){
  const W=640, pl=56, pr=8, pt=16, pb=30, ih=h-pt-pb, iw=W-pl-pr;
  const max=niceMax(Math.max(...vals,0)); const n=vals.length; const bw=Math.min(44, iw/n*0.56);
  let g="";
  for(let i=0;i<=4;i++){ const y=pt+ih-ih*i/4; g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#E4EEF0"/>
    <text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#8494A6">${fmt(max*i/4)}</text>`; }
  vals.forEach((v,i)=>{ const x=pl+iw*(i+.5)/n-bw/2, bh=ih*v/max, y=pt+ih-bh;
    g+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(bh,0)}" rx="5" fill="${i===hi?"#0F7C88":color}"><title>${esc(labels[i])}: ${fmt(v)}${unit}</title></rect>
    <text x="${x+bw/2}" y="${h-10}" text-anchor="middle" font-size="11" fill="#56677B">${esc(labels[i])}</text>`; });
  return `<svg viewBox="0 0 ${W} ${h}" width="100%" role="img" aria-label="Bar chart">${g}</svg>`;
}
function lineChart(labels, series, {h=220, fmt=v=>v}={}){
  const W=640, pl=56, pr=16, pt=16, pb=30, ih=h-pt-pb, iw=W-pl-pr;
  const all=series.flatMap(s=>s.vals); const max=niceMax(Math.max(...all));
  let g="";
  for(let i=0;i<=4;i++){ const y=pt+ih-ih*i/4; g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#E4EEF0"/><text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#8494A6">${fmt(max*i/4)}</text>`; }
  labels.forEach((l,i)=>{ const x=pl+iw*i/(labels.length-1); g+=`<text x="${x}" y="${h-10}" text-anchor="middle" font-size="11" fill="#56677B">${esc(l)}</text>`; });
  series.forEach(s=>{ const pts=s.vals.map((v,i)=>[pl+iw*i/(labels.length-1), pt+ih-ih*v/max]);
    g+=`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${s.color}" stroke-width="2.2" ${s.dash?'stroke-dasharray="5 4"':""}/>`;
    pts.forEach((p,i)=> g+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#fff" stroke="${s.color}" stroke-width="2"><title>${esc(s.name)} ${esc(labels[i])}: ${fmt(s.vals[i])}</title></circle>`); });
  return `<svg viewBox="0 0 ${W} ${h}" width="100%" role="img" aria-label="Line chart">${g}</svg>`;
}

const COMM_FIELDS = [
  {path:"status",label:"Agreement status",type:"select",opts:["Lead","Under Negotiation","Termsheet Signed","Agreement Signed","Dropped"]},
  {path:"lrp",label:"Plan type",type:"select",opts:["LRP","Lead","Drop"]},
  {path:"launch",label:"Projected launch date",type:"date"},
  {path:"profitShare",label:"Partner profit share (%)",type:"pct"},
  {path:"remark",label:"Remark",type:"text",full:true}
];
const REG_FIELDS = [
  {path:"reg:dossierP",label:"Projected dossier to MoH",type:"date"},{path:"reg:dossierA",label:"Actual dossier to MoH",type:"date"},
  {path:"reg:apprP",label:"Projected approval",type:"date"},{path:"reg:apprA",label:"Actual approval",type:"date"},
  {path:"reg:launchP",label:"Projected launch",type:"date"},{path:"reg:launchA",label:"Actual launch",type:"date"},
  {path:"reg:ip",label:"IP clearance",type:"select",opts:["Yes","No","No Patent"]},{path:"reg:agent",label:"Regulatory agent",type:"text"}
];
function getPath(d,p){ if(p.startsWith("reg:")) return d.reg[p.slice(4)]; if(p.startsWith("f:")){const[,y,k]=p.split(":");return fy(d,y)[k];} return d[p]; }
function setPath(d,p,v){
  if(p.startsWith("reg:")) d.reg[p.slice(4)]=v;
  else if(p.startsWith("f:")){ const[,y,k]=p.split(":"); const f=fy(d,y); f[k]=v; f.val=valOf(f.vol,f.trp); }
  else d[p]=v;
}
function startEdit(){
  const d=dealById(UI.dealId), vals={};
  [...COMM_FIELDS,...REG_FIELDS].forEach(f=>vals[f.path]=getPath(d,f.path));
  PLAN_FYS.forEach(y=>{vals[`f:${y}:vol`]=fy(d,y).vol; vals[`f:${y}:trp`]=fy(d,y).trp;});
  UI.edit={dealId:d.id, vals, orig:clone(vals), reason:"", err:{}};
  go("edit");
}
function fieldInput(f, v, id){
  const val = f.type==="pct" ? (v==null?"":Math.round(v*1000)/10) : (v ?? "");
  if(f.type==="select") return `<select class="select" id="${id}" data-edit="${f.path}">${f.opts.map(o=>`<option ${o===v?"selected":""}>${o}</option>`).join("")}</select>`;
  return `<input class="input" id="${id}" data-edit="${f.path}" type="${f.type==="date"?"date":f.type==="pct"?"number":"text"}" ${f.type==="pct"?'step="0.5" min="0" max="100"':""} value="${esc(val)}">`;
}
function editView(){

  if(r.tabs.overview==="edit") secs.push(`<div class="card"><div class="card-h"><h3>Commercial terms</h3></div><div class="card-b"><div class="form-grid">${COMM_FIELDS.map((f,i)=>`<div class="field ${f.full?"full":""}"><label for="e${i}">${f.label}</label>${fieldInput(f,E.vals[f.path],"e"+i)}</div>`).join("")}</div></div></div>`);

    ${PLAN_FYS.map(y=>`<tr><td><b>${y}</b></td><td class="r"><input class="input" type="number" min="0" step="1" data-edit="f:${y}:vol" value="${E.vals[`f:${y}:vol`]}" aria-label="${y} volume"></td><td class="r"><input class="input" type="number" min="0" step="0.01" data-edit="f:${y}:trp" value="${E.vals[`f:${y}:trp`]}" aria-label="${y} TRP"></td><td class="r"><b data-val="${y}">${lk(valOf(E.vals[`f:${y}:vol`],E.vals[`f:${y}:trp`]))}</b></td></tr>`).join("")}
    <tr class="hl"><td><b>Total</b></td><td class="r"><b data-tot="vol">${inr(PLAN_FYS.reduce((s,y)=>s+ +E.vals[`f:${y}:vol`],0))}</b></td><td></td><td class="r"><b data-tot="val">${cr(PLAN_FYS.reduce((s,y)=>s+valOf(E.vals[`f:${y}:vol`],E.vals[`f:${y}:trp`]),0))}</b></td></tr>

function fmtChange(c,v){ if(v==null||v==="") return "—"; return c.kind==="date"?fdate(v):c.kind==="num"?inr(v):c.kind==="usd"?usd(v):c.kind==="pct"?pct(v*100,1):esc(v); }
function kindOf(p){ if(p.startsWith("f:")) return p.endsWith("trp")?"usd":"num"; const f=[...COMM_FIELDS,...REG_FIELDS].find(x=>x.path===p); return f.type==="date"?"date":f.type==="pct"?"pct":"text"; }
function labelOf(p){ if(p.startsWith("f:")){const[,y,k]=p.split(":");return `${y} · ${k==="vol"?"Volume":"TRP / unit (USD)"}`;} return [...COMM_FIELDS,...REG_FIELDS].find(x=>x.path===p).label; }
function editChanges(){
  const E=UI.edit; return Object.keys(E.vals).filter(p=>String(E.vals[p]??"")!==String(E.orig[p]??"")).map(p=>({path:p,label:labelOf(p),old:E.orig[p],new:E.vals[p],kind:kindOf(p)}));
}
function sectionOf(ch){ const s=new Set(ch.map(c=>c.path.startsWith("f:")?"Forecast":c.path.startsWith("reg:")?"Regulatory":"Commercial")); return [...s].join(" & "); }
function diffTable(ch){
  return `<div class="tbl-wrap"><table class="tbl num"><thead><tr><th>Field</th><th class="r">Current</th><th class="r">Proposed</th><th class="r">Change</th></tr></thead><tbody>
  ${ch.map(c=>{ let dl=""; if((c.kind==="num"||c.kind==="usd"||c.kind==="pct") && c.old){const p=(c.new-c.old)/c.old*100; dl=`<span class="delta" style="color:${p>=0?"var(--good)":"var(--bad)"}">${p>=0?"▲ +":"▼ "}${p.toFixed(1)}%</span>`;} else if(c.kind==="date"&&c.old&&c.new){const x=days(c.old,c.new); dl=`<span class="delta">${x>0?"+":""}${x} days</span>`;}
    return `<tr><td><b>${esc(c.label)}</b></td><td class="r"><span class="old">${fmtChange(c,c.old)}</span></td><td class="r"><span class="new">${fmtChange(c,c.new)}</span></td><td class="r">${dl||"—"}</td></tr>`;}).join("")}
  </tbody></table></div>`;
}

function masters(){
  const ds=S.deals; const pick=k=>uniq(ds.map(d=>d[k]));
  const countries={}; ds.forEach(d=>{countries[d.country]=d.region;});
  return {customers:pick("customer"), countries, families:pick("family"), dosage:pick("dosage"), pack:pick("pack"), plant:pick("plant"), therapeutic:pick("therapeutic"), category:pick("category"), agreementType:pick("agreementType"), saleType:pick("saleType"), model:pick("model"), incoterms:pick("incoterms"), market:pick("market")};
}
function startNew(){
  UI.form = {step:0, err:{}, v:{customer:"",country:"",agreementType:"",saleType:"",model:"",excl:"Exclusive",status:"Lead",lrp:"Lead",
    family:"",strength:"",therapeutic:"",dosage:"",pack:"",packSize:"",plant:"",category:"",
    incoterms:"",market:"",profitShare:"",launch:"",remark:"",
    baseVol:"",baseTrp:"",growth:"8", fc:Object.fromEntries(PLAN_FYS.map(y=>[y,{vol:"",trp:""}]))}};
  go("new");
}
const REQ = [["customer","country","agreementType","saleType","model"],["family","strength","dosage","pack","packSize","plant","therapeutic","category"],["incoterms","market","profitShare","launch"],[]];
function validStep(i){
  const v=UI.form.v, err={};
  REQ[i].forEach(k=>{ if(v[k]===""||v[k]==null) err[k]="Required"; });
  if(i===2 && v.profitShare!=="" && (+v.profitShare<0 || +v.profitShare>100)) err.profitShare="Enter a share between 0 and 100";
  if(i===3) PLAN_FYS.forEach(y=>{ const f=v.fc[y]; if(!(+f.vol>0) || !(+f.trp>0)) err.fc="Fill volume and TRP for every year, or use the quick fill above."; });
  UI.form.err=err; return !Object.keys(err).length;
}
function nf(k,label,type,opts,extra=""){
  const v=UI.form.v[k], e=UI.form.err[k];

    : `<input class="input" id="n-${k}" data-new="${k}" type="${type}" value="${esc(v)}" ${extra}>`;
  return `<div class="field ${e?"invalid":""}"><label for="n-${k}">${label}</label>${input}${e?`<span class="err">${e}</span>`:""}</div>`;
}

const SEARCH_FIELDS = [
  ["Record ID",d=>d.id,"overview"],["Product",d=>title(d),"overview"],["Customer",d=>d.customer,"overview"],["Customer code",d=>d.custCode,"overview"],
  ["Country",d=>d.country,"overview"],["Region",d=>d.region,"overview"],["Therapeutic area",d=>d.therapeutic,"overview"],["Dosage form",d=>d.dosage,"overview"],

  ["Regulatory agent",d=>d.reg.agent,"regulatory"],["RA owner",d=>d.reg.ra,"regulatory"],["API vendor",d=>[d.cost.v1,d.cost.v2].filter(v=>v&&v!=="-").join(", "),"costing"],
  ["Market data source",d=>d.port?.source,"market"]
];

  {n:"Approvals behind budget", sf:{reg:"late"}, need:"regulatory"},
  {n:"Signed deals above ₹50 Cr", sf:{status:"Agreement Signed", minVal:"50"}, need:"forecast"},
  {n:"Launching in FY27-28", sf:{launchFrom:"2027-04-01", launchTo:"2028-03-31"}},
  {n:"Oncology deals", sf:{therapeutic:"Oncology"}}
];
const toks = () => { const q=UI.sq.trim().toLowerCase(); if(!q) return []; const t=q.split(/\s+/); if(t.length>1 && visibleDeals().some(d=>SEARCH_FIELDS.some(([,g])=>String(g(d)??"").toLowerCase().includes(q)))) return [q]; const long=t.filter(x=>x.length>1); return long.length?long:t; };
function mark(s,t){
  const h=esc(s); if(!t.length) return h;
  const re=new RegExp("("+t.map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gi");
  return h.replace(re,"<mark>$1</mark>");
}
function runSearch(){
  const T=toks(), F=UI.sf, fields=SEARCH_FIELDS.filter(f=>tabAccess(f[2])!=="none");
  const showVal=tabAccess("forecast")!=="none", showReg=tabAccess("regulatory")!=="none", out=[];
  for(const d of visibleDeals()){
    if(F.region && d.region!==F.region) continue;
    if(F.customer && d.customer!==F.customer) continue;
    if(F.family && d.family!==F.family) continue;
    if(F.therapeutic && d.therapeutic!==F.therapeutic) continue;
    if(F.bd && d.bd!==F.bd) continue;
    if(F.status && d.status!==F.status) continue;
    if(F.launchFrom && (!d.launch || d.launch<F.launchFrom)) continue;
    if(F.launchTo && (!d.launch || d.launch>F.launchTo)) continue;
    if(F.minVal!=="" && showVal && (fy(d,CUR_FY).val||0)/100 < +F.minVal) continue;
    if(F.reg && showReg){
      const late=!d.reg.apprA && days(d.reg.apprB,d.reg.apprP)>0;
      if(F.reg==="late" && !late) continue;
      if(F.reg==="approved" && !d.reg.apprA) continue;
      if(F.reg==="open" && d.reg.apprA) continue;
    }
    const hits=[];
    if(T.length){
      const vals=fields.map(([l,g])=>[l,String(g(d)??"")]); let ok=true;
      for(const t of T){ const m=vals.filter(([,v])=>v.toLowerCase().includes(t)); if(!m.length){ok=false;break;} m.forEach(x=>{ if(!hits.some(h=>h[0]===x[0])) hits.push(x); }); }
      if(!ok) continue;
    }
    out.push({d,hits});
  }
  const k=UI.ss;
  out.sort((a,b)=> k==="value" ? (fy(b.d,CUR_FY).val||0)-(fy(a.d,CUR_FY).val||0)
    : k==="launch" ? (a.d.launch||"9").localeCompare(b.d.launch||"9")
    : k==="approval" ? (a.d.reg.apprA||a.d.reg.apprP||"9").localeCompare(b.d.reg.apprA||b.d.reg.apprP||"9")
    : title(a.d).localeCompare(title(b.d)));
  return out;
}

    <td>${mark(d.customer,T)}<div class="faint" style="font-size:12px">${mark(d.country,T)} · ${mark(d.region,T)}</div></td>
    ${me().role!=="bd"?`<td style="white-space:nowrap">${mark(d.bdName,T)}</td>`:""}<td>${statusPill(d.status)}</td><td class="num" style="white-space:nowrap">${fdate(d.launch)}</td>
    ${showReg?`<td class="num" style="white-space:nowrap">${fdate(d.reg.apprA||d.reg.apprP)}${d.reg.apprA?`<div style="font-size:12px;color:var(--good);font-weight:700">Approved</div>`:""}</td>`:""}
    ${showVal?`<td class="r num" style="white-space:nowrap"><b>${cr(fy(d,CUR_FY).val)}</b></td>`:""}</tr>`).join("")}
  </tbody></table></div></div>`;

function repTable(D){

function repCsv(D){
  const q=v=>{const s=String(v??""); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const raw=(c,v)=>{ if(v==null) return ""; const x=c.csv?c.csv(v):v; return typeof x==="number"?Math.round(x*100)/100:x; };
  const rows=[D.cols.map(c=>q(c.l)), ...D.rows.map(r=>D.cols.map((c,i)=>q(raw(c,r[i])))), ...(D.total?[D.cols.map((c,i)=>q(raw(c,D.total[i])))]:[])];
  return rows.map(r=>r.join(",")).join("\n");
}

    cost:{batch:"—",api1:v.family+" API",api2:"—",v1:"To be sourced",v2:"—",years:[]}, port:null};
  S.deals.push(d);
  const rid="CR-"+(S.seqCR++);
  S.requests.push({id:rid, dealId:id, type:"new", by:u.id, at:nowIso(), status:"Pending", section:"New deal", reason:v.remark||"New opportunity entered by BD", changes:[]});
  S.log.push({at:nowIso(), by:u.id, text:`Created ${id} and submitted ${rid} · New deal`, deal:id}); save();
  UI.form=null; UI.dealId=id; UI.tab="overview"; go("deal"); toast(`${id} created and sent to MIS`);
}
function decide(ok){
  const r=S.requests.find(x=>x.id===UI.reqId), d=dealById(r.dealId), c=(UI.dec||"").trim();
  if(!ok && c.length<5){ UI.decErr="Tell the submitter what to fix, so they can resubmit."; render(); return; }
  r.status = ok?"Approved":"Rejected"; r.decidedBy=S.userId; r.decidedAt=nowIso(); r.decision=c;
  if(r.type==="new"){ if(ok){ d.approved=true; d.rejected=null; } else d.rejected=c; }
  else if(ok) r.changes.forEach(ch=>setPath(d, ch.path, ch.new));
  S.log.push({at:nowIso(), by:S.userId, text:`${ok?"Approved":"Returned"} ${r.id}${c?" · "+c:""}`, deal:d.id}); save();
  UI.dec=""; UI.decErr=null; render(); toast(ok?`${r.id} approved and live in dashboards`:`${r.id} returned to ${userName(r.by)}`);
}

document.addEventListener("click", e=>{
  const g=e.target.closest("[data-go]"); if(g){ go(g.dataset.go); return; }
  const a=e.target.closest("[data-act]"); if(!a) return;
  const act=a.dataset.act, id=a.dataset.id;
  if(act==="close-modal-bg"){ if(e.target===a){UI.modal=null; render();} return; }
  ({
    login(){ S.userId=id; save(); Object.assign(UI,{q:"",region:"",status:"",kind:"",tab:"overview",reqFilter:"Pending",sort:me().role==="reg"?"launch":"value"}); go(me().role==="admin"?"access":"home"); },
    logout(){ S.userId=null; save(); go("home"); },
    reset(){ S=seed(); save(); render(); toast("Demo data reset"); },
    "open-deal"(){ if(!(UI.view==="deal" && UI.dealId===id)) UI.tab="overview"; UI.dealId=id; go("deal"); },
    tab(){ UI.tab=a.dataset.tab; render(); },
    "cost-fy"(){ UI.costFy=a.dataset.fy; render(); },
    edit(){ startEdit(); },
    new(){ startNew(); },
    "clear-filters"(){ Object.assign(UI,{q:"",region:"",status:"",kind:""}); render(); },
    "review-edit"(){
      const E=UI.edit, ch=editChanges(); E.err={};
      if(!ch.length) E.err.none="Nothing has changed yet. Edit a value before submitting.";
      if(E.reason.trim().length<5) E.err.reason="Add a short reason so MIS can review the change.";
      if(Object.keys(E.err).length){ render(); return; }
      UI.modal=`<div class="card"><div class="card-h"><h3>Submit ${ch.length} change${ch.length>1?"s":""} for approval?</h3></div><div class="card-b stack" style="gap:16px">${diffTable(ch)}<div class="panel" style="padding:12px 16px"><span class="label">Reason</span><div>${esc(E.reason)}</div></div><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close-modal">Keep editing</button><button class="btn btn-primary" data-act="confirm-edit">${ic("check")}Submit to MIS</button></div></div></div>`;
      render();
    },
    "close-modal"(){ UI.modal=null; render(); },
    "confirm-edit"(){ UI.modal=null; submitEdit(editChanges()); },
    "cancel-new"(){ UI.form=null; go("deals"); },
    "step-back"(){ UI.form.step--; UI.form.err={}; render(); },
    "step-next"(){ if(validStep(UI.form.step)){ UI.form.step++; } render(); },
    "submit-new"(){ submitNew(); },
    quickfill(){ const v=UI.form.v, b=+v.baseVol, t=+v.baseTrp, gr=+v.growth/100;
      if(!(b>0)||!(t>0)){ UI.form.err={baseVol:b>0?null:"Enter a volume", baseTrp:t>0?null:"Enter a TRP"}; render(); return; }
      PLAN_FYS.forEach((y,i)=>{ v.fc[y]={vol:Math.round(b*Math.pow(1+gr,i)), trp:Math.round(t*Math.pow(1.02,i)*100)/100}; }); UI.form.err={}; render(); },
    "req-filter"(){ UI.reqFilter=a.dataset.f; render(); },
    "open-req"(){ UI.reqId=id; UI.dec=""; UI.decErr=null; go("request"); },
    approve(){ decide(true); }, reject(){ decide(false); },
    "s-preset"(){ UI.sf={...SF0,...PRESETS[+a.dataset.i].sf}; UI.sq=""; render(); },
    "s-clear"(){ UI.sf={...SF0}; UI.sq=""; render(); },
    "s-sort"(){ UI.ss=a.dataset.k; document.getElementById("s-results").innerHTML=searchResultsHtml(); },
    rep(){ UI.rep=id; render(); },
    "an-m"(){ UI.an.m=a.dataset.m; render(); },
    drill(){ drill(a.dataset.k); },
    "wi-reset"(){ UI.wi={trp:0,vol:0,ero:0,fx:FX}; render(); },
    "copy-csv"(){
      const csv=repCsv(repData(UI.rep));
      const fallback=()=>{ UI.modal=`<div class="card"><div class="card-h"><h3>Copy the report</h3></div><div class="card-b stack" style="gap:12px"><p class="muted">Your browser blocked automatic copying. Select all of the text below, copy it, and paste into Excel.</p><textarea class="input" id="csvbox" rows="12" readonly>${esc(csv)}</textarea><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close-modal">Close</button></div></div></div>`; render(); const b=document.getElementById("csvbox"); if(b){b.focus(); b.select();} };
      try{ navigator.clipboard.writeText(csv).then(()=>toast("Report copied. Paste it into Excel or an email."), fallback); }catch(err){ fallback(); }
    }
  })[act]?.();
});
document.addEventListener("input", e=>{
  const t=e.target;
  if(t.id==="gq"){ UI.sq=t.value; document.getElementById("s-results").innerHTML=searchResultsHtml(); return; }
  if(t.dataset.wi){ const k=t.dataset.wi; UI.wi[k]=+t.value; const l=document.querySelector(`[data-wv="${k}"]`); if(l) l.textContent=wiFmt(k,UI.wi[k]); document.getElementById("whatif").innerHTML=whatIfHtml(anDeals()); return; }
  if(t.id==="q"){ UI.q=t.value; document.getElementById("deal-grid").innerHTML=gridHtml(filtered()); return; }
  if(t.dataset.edit){ const E=UI.edit, p=t.dataset.edit;
    if(p==="reason"){ E.reason=t.value; return; }
    const f=[...COMM_FIELDS,...REG_FIELDS].find(x=>x.path===p);
    let v=t.value; if(p.startsWith("f:")) v = v===""?"":+v; else if(f?.type==="pct") v = v===""?"":Math.round(+v*10)/1000;
    E.vals[p]=v;
    if(p.startsWith("f:")){ const y=p.split(":")[1]; const cell=document.querySelector(`[data-val="${y}"]`); if(cell) cell.textContent=lk(valOf(+E.vals[`f:${y}:vol`]||0,+E.vals[`f:${y}:trp`]||0));
      const tv=document.querySelector('[data-tot="vol"]'), tt=document.querySelector('[data-tot="val"]');
      if(tv) tv.textContent=inr(PLAN_FYS.reduce((s,y)=>s+(+E.vals[`f:${y}:vol`]||0),0)); if(tt) tt.textContent=cr(PLAN_FYS.reduce((s,y)=>s+valOf(+E.vals[`f:${y}:vol`]||0,+E.vals[`f:${y}:trp`]||0),0)); }
    return; }
  if(t.dataset.new){ UI.form.v[t.dataset.new]=t.value; return; }
  if(t.dataset.fc){ const [y,k]=t.dataset.fc.split(":"); const f=UI.form.v.fc[y]; f[k]=t.value; const c=document.querySelector(`[data-val="${y}"]`); if(c) c.textContent = +f.vol&&+f.trp?lk(valOf(+f.vol,+f.trp)):"—"; return; }
  if(t.id==="dec"){ UI.dec=t.value; return; }
});
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.dataset.sf){ UI.sf[t.dataset.sf]=t.value; render(); return; }
  if(t.dataset.rp){ UI.rp[t.dataset.rp]=t.value; render(); return; }
  if(t.dataset.an){ UI.an[t.dataset.an]=t.value; render(); return; }
  if(t.id==="f-region"){UI.region=t.value; render();} else if(t.id==="f-status"){UI.status=t.value; render();}
  else if(t.id==="f-kind"){UI.kind=t.value; render();} else if(t.id==="f-sort"){UI.sort=t.value; render();}
  else if(t.dataset.new==="country"){ UI.form.v.country=t.value; render(); }
  else if(t.dataset.edit){ t.dispatchEvent(new Event("input",{bubbles:true})); }
  else if(t.dataset.role){ const x=USERS.find(u=>u.id===t.dataset.role); const from=ROLES[x.role].name; x.role=t.value; (S.roles=S.roles||{})[x.id]=t.value; S.log.push({at:nowIso(),by:S.userId,text:`Changed ${x.name}'s role from ${from} to ${ROLES[x.role].name}`,deal:null}); save(); render(); toast(`${x.name} is now ${ROLES[x.role].name}`); }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && UI.modal){ UI.modal=null; render(); } });
render();
</script>
